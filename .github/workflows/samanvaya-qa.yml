name: Samanvaya QA

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      
      - name: Run tests
        run: bash ci/run_tests.sh
      
      - name: Upload results
        if: always()
        env:
          SAMANVAYA_API_URL: ${{ secrets.SAMANVAYA_API_URL }}
          SAMANVAYA_PROJECT_ID: ${{ secrets.SAMANVAYA_PROJECT_ID }}
          SAMANVAYA_TEST_RESULTS_TOKEN: ${{ secrets.SAMANVAYA_TEST_RESULTS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -f "$TEST_RESULTS_FILE" ]; then
            python ci/upload_junit_results.py --junit "$TEST_RESULTS_FILE"
          fi
